<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trampoline rental</title>
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <header>
            <h1>Trampoline Rental</h1>
        </header>
        <section>
            <img src="assets/principal.png" alt="Crianças brincando em trampolim" loading="lazy" class="bg-img">
        </section>
        <section class="top-site">
            <div>
                <h2>Rental Management</h2>
                <table id="table" style="width: 100%;">
                    <thead>

                        <tr>                                                        
                            <th>ID</th>
                            <th>Data Aluguel</th>
                            <th>Horas de Festa</th>
                            <th>Valor do aluguel</th>
                            <th>Locatário</th>
                        </tr>
                    </thead>
                    <tbody id="body-table">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const baseApi = "http://127.0.0.1:5000"
        const dateFormatter = new Intl.DateTimeFormat("pt-BR", {
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        })
        const formatDateForTable = (date) => {
            const dateProcessed = new Date(`${date}T00:00:00`)
            return dateFormatter.format(dateProcessed);

        }
        const formatCurrencyBRL = (value) => Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

        const getAllRents = async () => {

            try {
                const response = await fetch(`${baseApi}/rent`)
                const data = await response.json()
                if (!response.ok) {
                    alert(data.message ?? 'Ocorreu um erro')
                    return []
                }
                return data
            } catch (error) {
                alert('Erro ao se conectar com servidor')
            }
        }

        const renderTable = async () => {
            const rents = await getAllRents()

            const rows = rents.map(rent => {
                return `      <tr>
                        <td>${rent.id}</td>
                        <td>${formatDateForTable(rent.rent_date)}</td>
                        <td>${rent.hours_rented}h</td>
                        <td>${formatCurrencyBRL(rent.rent_amount)}</td>
                        <td>${rent.renter}</td>
                    </tr>
                    `

            }).join("")
            const bodyTable = document.getElementById('body-table')
            bodyTable.innerHTML = rents.length === 0
                ? `<tr><td colspan="5">Não foram localizados registros</td></tr>`
                : rows
        }
        renderTable()
    </script>
</body>

</html>
