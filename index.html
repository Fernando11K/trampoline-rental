<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trampoline rental</title>
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>
    <main>
        <header>
            <h1>Trampoline Rental</h1>
        </header>
        <section>
            <img src="assets/principal.png" alt="Crianças brincando em trampolim" loading="lazy" class="bg-img">
        </section>
        <section>
            <div class="container">
                <div>
                    <h2>Gerenciamento de Alugueis</h2>
                    <hr style="  border-top: 1px solid #2152d6;">

                    <form id="form" class="rental-form" action="/rent" method="POST">
                        <div class="field">
                            <label for="rent_date">Data do aluguel</label>
                            <input type="date" id="rent_date" name="rent_date" required>
                            <small class="error-message" data-error-for="rent_date" aria-live="polite"></small>
                        </div>

                        <div class="field">
                            <label for="hours_rented">Horas de festa</label>
                            <input type="number" id="hours_rented" name="hours_rented" max="12" required>
                            <small class="error-message" data-error-for="hours_rented" aria-live="polite"></small>
                        </div>

                        <div class="field">
                            <label for="rent_amount">Valor do aluguel</label>
                            <input type="text" id="rent_amount" name="rent_amount" pattern="^\d{1,3}(\.\d{3})*,\d{2}$"
                                title="Formato: 1.234,56" required>
                            <small class="error-message" data-error-for="rent_amount" aria-live="polite"></small>
                        </div>

                        <div class="field">
                            <label for="renter">Locatário</label>
                            <input type="text" id="renter" name="renter" required>
                            <small class="error-message" data-error-for="renter" aria-live="polite"></small>
                        </div>
                        <div class="schedule-button">
                            <button type="submit" title="Agendar" class="submit-btn">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </form>
                    <div class="table-wrapper">
                        <table id="table">
                            <thead>
                                <tr>
                                    <th>Ações</th>
                                    <th>Data Aluguel</th>
                                    <th>Horas de Festa</th>
                                    <th>Valor do aluguel</th>
                                    <th>Locatário</th>
                                </tr>
                            </thead>
                            <tbody id="body-table">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/validation-messages.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
